<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fcf8f1">
<link rel="icon" href="brand/icon-192.png">
<link rel="apple-touch-icon" href="brand/icon-192.png">
<title>MIAU Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* standalone reset (the artifact host used to provide this) */
html{-webkit-text-size-adjust:100%} body{margin:0} [hidden]{display:none!important} img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* sign-in gate + account */
body.locked .side,body.locked .main,body.locked .tabbar{visibility:hidden}
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:28px;display:flex;flex-direction:column;gap:16px;text-align:center}
.gate-card .brand{justify-content:center;padding:0;font-size:17px}
.gate-card h1{margin:0;font-size:20px;font-weight:600}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;width:100%}
.gbtn:hover{background:var(--sunken)} .gbtn:disabled{opacity:.5;cursor:not-allowed}
.gate-msg{min-height:18px;font-size:13px;color:var(--bad)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
#acct-side .nav{font-size:13px}
.acct-sheet{position:fixed;z-index:51;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .15s,transform .2s;
  left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:340px;border-radius:12px;border:1px solid var(--border);transform:translateY(8px)}
.acct-sheet.on{opacity:1;pointer-events:auto;transform:none}
.acct-shade{position:fixed;inset:0;z-index:50;display:none} .acct-shade.on{display:block}
@media (max-width:900px){.acct-sheet{left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)} .acct-shade.on{background:rgba(10,10,12,.35)}}

/* Layout: SaaS app shell — fixed sidebar (desktop) / bottom tabs (phone); pages: Menu dashboard, Drink detail, Ingredients table, In-house; slide-over editor. */
:root{
  /* MIAU brand: cream #fcf8f1 · cocoa #3e2f24 · terracotta #b96a4c */
  --bg:#fcf8f1; --surface:#FFFFFF; --sunken:#f6efe4; --border:#ebe1d3; --border-strong:#dccfbd;
  --text:#3e2f24; --muted:#7c6a5c; --faint:#a8998b;
  --accent:#a95c3f; --accent-ink:#FFFFFF; --accent-soft:#f6e3d8;
  --ok:#4a7a4b; --ok-bg:#e6f0e2; --warn:#955807; --warn-bg:#fbeedb; --bad:#ad3e28; --bad-bg:#f9e2da;
  --shadow:0 1px 2px rgba(62,47,36,.06),0 1px 1px rgba(62,47,36,.04);
  --shadow-lg:0 14px 40px rgba(62,47,36,.18);
  --f:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif; --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --r:16px; --side:236px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d1612; --surface:#271e18; --sunken:#30261f; --border:#3b2f27; --border-strong:#4b3d33;
  --text:#f5ede2; --muted:#c3b3a3; --faint:#917f70;
  --accent:#dd8e6e; --accent-ink:#2a1b13; --accent-soft:#3c2920;
  --ok:#8fc48f; --ok-bg:#1f2c1e; --warn:#e5aa52; --warn-bg:#352816; --bad:#f08b73; --bad-bg:#3b1e17;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 14px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1612; --surface:#271e18; --sunken:#30261f; --border:#3b2f27; --border-strong:#4b3d33;
  --text:#f5ede2; --muted:#c3b3a3; --faint:#917f70;
  --accent:#dd8e6e; --accent-ink:#2a1b13; --accent-soft:#3c2920;
  --ok:#8fc48f; --ok-bg:#1f2c1e; --warn:#e5aa52; --warn-bg:#352816; --bad:#f08b73; --bad-bg:#3b1e17;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 14px 40px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{flex:none}

/* shell */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--border);
  padding:calc(env(safe-area-inset-top,0px) + 18px) 12px 18px calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;padding:4px 10px 18px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted);text-align:left;font-weight:500;width:100%}
.nav:hover{background:var(--sunken);color:var(--text)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.busy{background:var(--warn)}
.main{margin-left:var(--side);min-height:100vh;padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tabbar{display:none}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.crumb button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0}
.crumb button:hover{color:var(--text)}
.title-in{font-size:22px;font-weight:600;letter-spacing:-.01em;border:1px solid transparent;border-radius:8px;padding:2px 8px;margin-left:-9px;background:transparent;width:min(560px,100%)}
.title-in:hover{border-color:var(--border)} .title-in:focus{border-color:var(--accent);outline:none;background:var(--surface)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--sunken);color:var(--text)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.icon-btn{border:0;background:none;color:var(--faint);cursor:pointer;width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
.icon-btn:hover{background:var(--sunken);color:var(--bad)}
.in,.sel{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.in:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.num{text-align:right}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .in{padding-left:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap;border:0}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.neutral{background:var(--sunken);color:var(--muted)}
button.badge{cursor:pointer} button.badge:hover{filter:brightness(.96)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* cards + kpis */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-h h2{font-size:14px;font-weight:600;margin:0}
.card-b{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--faint);margin-top:2px}
.kpi.alert .v{color:var(--warn)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunken)}
.r{text-align:right}
.size{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--sunken);border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap;display:inline-block}
.bar{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;width:64px;display:inline-block;vertical-align:middle;margin-left:8px}
.bar span{display:block;height:100%;background:var(--ok)} .bar.over span{background:var(--bad)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* detail layout */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);display:flex;flex-direction:column;gap:16px}
.econ .big{font-size:30px;font-weight:600;letter-spacing:-.02em}
.econ .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border)}
.econ .row:first-of-type{border-top:0}
.econ .row .in{width:120px}
.meter{height:6px;border-radius:3px;background:var(--sunken);position:relative;margin:4px 0 2px}
.meter span{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ok)}
.meter.over span{background:var(--bad)}
.meter i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
.setrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.unitwrap{position:relative} .unitwrap .in{padding-right:34px} .unitwrap b{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:400;color:var(--faint);font-size:12px;pointer-events:none}
.unitwrap.pre .in{padding-right:10px;padding-left:26px} .unitwrap.pre b{right:auto;left:10px}

/* recipe lines */
.lines .lh,.lines .ln{display:grid;grid-template-columns:minmax(0,1fr) 92px 74px 96px 28px;gap:10px;align-items:center;padding:0 16px}
.lines .lh{font-size:12px;color:var(--muted);font-weight:500;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.lines .ln{padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.ln .sub{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-top:-2px}
.ln .cost{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ln.flag{background:linear-gradient(90deg,var(--warn-bg),transparent 70%)}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.sw input{appearance:none;width:26px;height:15px;border-radius:99px;background:var(--border-strong);position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--accent)} .sw input:checked::after{transform:translateX(11px)}
.addrow{padding:12px 16px}
details.nut>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:600}
details.nut>summary::-webkit-details-marker{display:none}
details.nut[open]>summary{border-bottom:1px solid var(--border)}
.nl{padding:8px 16px 14px}
.nl div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.nl div:last-child{border-bottom:0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow-lg);
  transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.dh h3{margin:0;font-size:16px;font-weight:600}
.db{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;flex:1}
.df{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.sentence{display:grid;grid-template-columns:1fr 84px auto 1fr;gap:8px;align-items:center}
.sentence span{color:var(--muted);font-size:13px}
.result{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:15px;font-weight:500}
.nutgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hl{animation:hl 1.6s ease}
@keyframes hl{0%,40%{box-shadow:0 0 0 4px var(--warn-bg)}100%{box-shadow:none}}


/* desktop-only refinements (phone styles below override where needed) */
@media (min-width:901px){
  .page{max-width:1400px}
  .kpis.five{grid-template-columns:repeat(5,minmax(0,1fr))} .kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  button.kpi{text-align:left;cursor:pointer;font:inherit;color:inherit} button.kpi:hover{border-color:var(--border-strong)}
  .kbd-hint{font-size:12px;color:var(--faint)} kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);color:var(--muted)}
  .dtable thead th{position:sticky;top:0;z-index:1}
  .sortb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:inherit}
  .sortb:hover{color:var(--text)} .sortb:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .sortb .arr{color:var(--accent);font-weight:600;min-width:8px}
  .dtable td{padding-top:7px;padding-bottom:7px}
  .cellwrap{width:112px;margin-left:auto} .cellin{padding:5px 8px 5px 24px;border-color:transparent;background:transparent}
  tr:hover .cellin,.cellin:focus{border-color:var(--border);background:var(--surface)}
  .grid td{padding:5px 8px} .grid th{padding:10px 8px}
  .grid .gin{padding:5px 8px} .grid .unitwrap .gin{padding-right:26px} .grid .unitwrap.pre .gin{padding-left:22px;padding-right:8px}
  .grid .gname{min-width:200px;font-weight:500}
  .grid td:nth-child(3) .unitwrap,.grid td:nth-child(6) .unitwrap,.grid td:nth-child(7) .unitwrap{width:96px} .grid td:nth-child(5) .unitwrap{width:110px}
  .grid select.gin{width:auto}
  .grid tr:hover td{background:var(--sunken)}
  .grid .more{color:var(--muted)} .grid .more:hover{color:var(--text)}
  .dgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
  .side-col{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px}
  .setrow.two{grid-template-columns:1fr 1fr}
  .rscroll{overflow-x:auto}
  .rt .rh,.rt .rr{display:grid;grid-template-columns:minmax(210px,1fr) 72px 62px 78px 84px 84px 44px 128px 28px;gap:8px;align-items:center;padding:8px 16px;min-width:880px}
  .rt .rh{font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);padding-top:10px;padding-bottom:10px}
  .rt .rr{border-bottom:1px solid var(--border)} .rt .rr.flag{background:linear-gradient(90deg,var(--warn-bg),transparent 60%)}
  .rt .r{text-align:right}
  .kpi .meter{margin-top:10px}
  .kpi-in{font-size:20px;font-weight:600;padding:4px 8px 4px 26px}
}
@media (min-width:901px) and (max-width:1279px){
  .dgrid{grid-template-columns:1fr} .side-col{position:static;display:grid;grid-template-columns:1fr 1fr}
  .kpis.five{grid-template-columns:repeat(3,minmax(0,1fr))}
}


/* online ordering: staff */
.count.hotc{background:var(--bad);color:#fff}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ocard{display:flex;flex-direction:column}
.ocard.hot{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.oc-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.ocode{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:.04em}
.oc-b{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.oname{font-weight:600}
.olines{list-style:none;margin:4px 0;padding:0}
.olines li{display:flex;gap:6px;padding:4px 0;border-bottom:1px dashed var(--border);font-size:13px}
.olines li .num{margin-left:auto}
.onote{font-size:13px;color:var(--muted);font-style:italic}
.ototal{display:flex;justify-content:space-between;font-size:15px;padding-top:2px}
.oref{font-size:13px}
.oc-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--border)}
.ogrid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.qrthumb{width:96px;height:96px;object-fit:contain;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px}
.qrthumb.empty,.othumb.empty{display:grid;place-items:center;color:var(--faint);font-size:12px}
.olist{display:flex;flex-direction:column}
.ogroup{border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.og-h{display:flex;align-items:center;gap:12px;min-width:0}

<script>
// CALC-START
const UNITS=["g","ml","pc"];
const NUTS=[["kcal","Energy","kcal"],["fat","Total fat","g"],["sat","Saturated fat","g"],["carb","Total carbohydrate","g"],["sugar","Total sugars","g"],["protein","Protein","g"],["sodium","Sodium","mg"]];
const numOrNull=v=>(v===null||v===undefined||v==="")?null:(isFinite(+v)?+v:null);
function isPrep(it){return it&&it.category==="House-made";}
// scale factor for a drink (target volume ÷ recipe volume) or a prep (batch multiplier); 1 when unset
function scaleOf(d){
  if(isPrep(d)){const m=+d.batchMult;return m>0?m:1;}
  const b=+d.baseVol,t=+d.targetVol;return (b>0&&t>0)?t/b:1;
}
function qtyUsed(l,f){if(l.qty===null||l.qty===undefined||l.qty==="")return null;const q=+l.qty||0;return l.fixed?q:q*f;}
// cost per base unit of an item; null = no price yet
function baseRate(it, items, depth){
  depth=depth||0;
  if(isPrep(it)){
    if(depth>8) return null;               // guards against a prep that contains itself
    const f=scaleOf(it), r=recipeCost(it.lines||[], items, depth+1, f), yq=+it.yieldQty*f;
    const y=(it.yield===""||it.yield==null)?1:+it.yield;   // usable % after waste (cost only)
    if(r.unpriced>0) return null;                           // not fully priced until every ingredient has a price
    return (yq>0&&y>0) ? r.total/(yq*y) : null;
  }
  const size=+it.packSize, price=+it.packPrice, y=(it.yield===""||it.yield==null)?1:+it.yield;
  if(it.packPrice==null||it.packPrice===""||!(size>0)||!(y>0)||!isFinite(price)) return null;
  return price/(size*y);
}
// cost per recipe unit for one line, with g<->ml conversion through density (g per ml)
function lineRate(l, items, depth){
  const it=items[l.itemId];
  if(!l.itemId) return {status:"empty",rate:0,base:null,it:null};
  if(!it) return {status:"missing",rate:0,base:null,it:null};
  const b=baseRate(it, items, depth), b0=b==null?0:b, u=l.unit||it.unit, d=+it.density;
  // factor converts a recipe quantity into the item's base unit
  let factor, status="ok";
  if(u===it.unit) factor=1;
  else if(u==="g"&&it.unit==="ml") { if(d>0) factor=1/d; else {factor=0;status="density";} }
  else if(u==="ml"&&it.unit==="g") { if(d>0) factor=d; else {factor=0;status="density";} }
  else {factor=0;status="mismatch";}
  return {status,rate:b0*factor,factor,base:b,it,unit:u};
}
function recipeCost(lines, items, depth, f){
  f=f||1;
  let total=0,pkg=0,attention=0,unpriced=0;
  const out=(lines||[]).map(l=>{
    const r=lineRate(l, items, depth);
    const used=qtyUsed(l,f);
    const blankQty=l.itemId&&used===null;
    const cost=blankQty?0:used*r.rate;
    if(r.status==="missing"||r.status==="density"||r.status==="mismatch"||blankQty) attention++;
    if(r.it&&r.base==null) unpriced++;                     // blank price = unpriced; ₱0 is a real price
    total+=cost; if(r.it&&r.it.category==="Packaging") pkg+=cost;
    return Object.assign({cost,blankQty,used},r);
  });
  return {lines:out,total,pkg,ing:total-pkg,attention,unpriced};
}
// nutrients per 100 of the item's base unit; null = no data
function nutrPer100(it, items, depth){
  depth=depth||0; const out={};
  if(isPrep(it)&&!it.nutrManual){
    const f=scaleOf(it), yq=+it.yieldQty*f;
    if(depth>8||!(yq>0)){NUTS.forEach(([k])=>out[k]=null);return out;}
    const r=recipeNutrition(it.lines||[], items, depth+1, f);
    NUTS.forEach(([k])=>out[k]=r.missing[k]?null:r.total[k]/yq*100);
    return out;
  }
  const n=it.nutr||{}; NUTS.forEach(([k])=>out[k]=numOrNull(n[k])); return out;
}
function recipeNutrition(lines, items, depth, f){
  f=f||1;
  const total={},missing={}; NUTS.forEach(([k])=>{total[k]=0;missing[k]=0;});
  for(const l of (lines||[])){
    const r=lineRate(l, items, depth); if(!r.it) continue;
    const used=qtyUsed(l,f);
    const qb=(used===null?0:used)*r.factor;
    const v=nutrPer100(r.it, items, depth);
    NUTS.forEach(([k])=>{ if(v[k]==null) missing[k]++; else total[k]+=qb/100*v[k]; });
  }
  return {total,missing};
}
function drinkCalc(d, items){
  const r=recipeCost(d.lines, items, 0, scaleOf(d)), vat=+d.vat||0, price=+d.price, target=+d.target;
  const net=price>0?price/(1+vat):null;
  return Object.assign(r,{net,
    costPct: net? r.total/net : null,
    gp: net? net-r.total : null,
    suggested: target>0? r.total/target*(1+vat) : null});
}
// CALC-END

/* ================= app ================= */
const $=s=>document.querySelector(s);
const peso=v=>v==null||!isFinite(v)?"—":"₱"+v.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const peso4=v=>v==null||!isFinite(v)?"—":"₱"+(+v).toFixed(4);
const pct=v=>v==null||!isFinite(v)?"—":(v*100).toFixed(1)+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rid=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtN=(v,u)=>(u==="kcal"||u==="mg"?Math.round(v).toLocaleString("en-PH"):(+v).toFixed(1))+" "+u;
const numIn=v=>v==null||v===""?"":+(+v).toFixed(4);
const IC={
  menu:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  box:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  flask:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/></svg>',
  plus:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  x:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  chev:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>'
};
const CAT_LABEL={"Ingredient":"Ingredient","Packaging":"Packaging","House-made":"In-house"};

const S={items:{},drinks:{},view:"menu",sel:null,drawer:null,q:"",mf:"all",iq:"",if:"all",db:null,loaded:{items:false,drinks:false},readonly:false};
const view=$("#view");

/* ---------- persistence ---------- */
const timers={},chains={}; let pending=0;
function saving(on){const d=$("#savedot"),t=$("#savetext");if(!d)return;d.classList.toggle("busy",on);t.textContent=on?"Saving…":"Saved";}
function save(col,id,now){
  if(!S.db||S.readonly) return;
  clearTimeout(timers[col+id]); saving(true);
  timers[col+id]=setTimeout(()=>{
    delete timers[col+id];
    const src=col==="items"?S.items[id]:S.drinks[id]; if(!src) return;
    const body=JSON.parse(JSON.stringify(src)); pending++;
    chains[col+id]=(chains[col+id]||Promise.resolve()).then(()=>S.db.collection(col).doc(id).set(body))
      .catch(e=>{ if(e&&e.code==="invalid_argument"){S.readonly=true;toastErr("View only");} else toastErr("Not saved. Check connection."); })
      .finally(()=>{pending--; if(!pending&&!Object.keys(timers).length) saving(false);});
  },now?0:450);
}
function toastErr(m){const t=$("#savetext");if(t){t.textContent=m;$("#savedot").classList.add("busy");}}
function remove(col,id){
  if(col==="items") delete S.items[id]; else delete S.drinks[id];
  if(S.db&&!S.readonly) S.db.collection(col).doc(id).delete().catch(()=>toastErr("Delete failed"));
}

/* ---------- derived ---------- */
const ORDER={"Ingredient":0,"House-made":1,"Packaging":2};
const items=()=>Object.entries(S.items).sort((a,b)=>(ORDER[a[1].category]??3)-(ORDER[b[1].category]??3)||(a[1].name||"").localeCompare(b[1].name||""));
const drinks=()=>Object.entries(S.drinks).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"")||(+a[1].baseVol||0)-(+b[1].baseVol||0)||(+a[1].targetVol||0)-(+b[1].targetVol||0));
const preps=()=>items().filter(([,it])=>isPrep(it));
const cup=d=>+d.targetVol||+d.baseVol||null;
function status(d,c){
  if(!(d.lines||[]).some(l=>l.itemId)) return {k:"neutral",t:"Empty",n:0};
  const n=c.attention+c.unpriced;
  if(n) return {k:"warn",t:n+" to fix",n};
  if(!(+d.price>0)) return {k:"neutral",t:"No price",n:0};
  if(+d.target>0&&c.costPct>+d.target) return {k:"bad",t:"Over target",n:0};
  return {k:"ok",t:"On target",n:0};
}
function needs(){ // ingredient-level to-dos
  const price=new Set(),dens=new Set();
  for(const [id,it] of Object.entries(S.items)) if(!isPrep(it)&&baseRate(it,S.items,0)==null) price.add(id);
  const scan=lines=>(lines||[]).forEach(l=>{const r=lineRate(l,S.items,0);if(r.status==="density")dens.add(l.itemId);});
  Object.values(S.drinks).forEach(d=>scan(d.lines)); preps().forEach(([,p])=>scan(p.lines));
  return {price,dens};
}
function usedIn(id){return Object.values(S.drinks).filter(d=>(d.lines||[]).some(l=>l.itemId===id)).length+preps().filter(([,p])=>(p.lines||[]).some(l=>l.itemId===id)).length;}

/* ---------- nav ---------- */
function renderNav(){
  const n=needs(), cnt=new Set([...n.price,...n.dens]).size;
  const tabs=[["menu","Menu",IC.menu,0],["items","Ingredients",IC.box,cnt],["preps","In-house",IC.flask,0]];
  const act=S.view==="drink"?"menu":S.view==="prep"?"preps":S.view;
  const html=tabs.map(([k,l,i,c])=>`<button class="nav" data-nav="${k}" ${act===k?'aria-current="page"':""}>${i}<span>${l}</span>${c?`<span class="count">${c}</span>`:""}</button>`).join("");
  $("#nav-side").innerHTML=html; $("#nav-tab").innerHTML=html;
}
function go(v,sel){S.view=v;S.sel=sel??null;render();window.scrollTo(0,0);}

/* ---------- render root ---------- */
function render(){
  renderNav();
  if(!S.loaded.items||!S.loaded.drinks){view.innerHTML='<div class="empty">Loading…</div>';return;}
  if(S.view==="drink"&&S.drinks[S.sel]) renderDetail("drink");
  else if(S.view==="prep"&&isPrep(S.items[S.sel])) renderDetail("prep");
  else if(S.view==="items") renderItems();
  else if(S.view==="preps") renderPreps();
  else {S.view="menu";renderMenu();}
  applyArmed();
}

/* ---------- Menu (dashboard) ---------- */
function renderMenu(){return isDesk()?renderMenuD():renderMenuM();}
function renderMenuM(){
  const rows=drinks().map(([id,d])=>{const c=drinkCalc(d,S.items);return {id,d,c,s:status(d,c)};});
  const priced=rows.filter(r=>r.s.k==="ok"||r.s.k==="bad");
  const avg=priced.length?priced.reduce((a,r)=>a+r.c.costPct,0)/priced.length:null;
  const fix=rows.filter(r=>r.s.k==="warn").length, n=needs(), nItems=new Set([...n.price,...n.dens]).size;
  const q=S.q.toLowerCase();
  const shown=rows.filter(r=>(!q||(r.d.name||"").toLowerCase().includes(q))&&(S.mf==="all"||(S.mf==="fix"&&r.s.k==="warn")||(S.mf==="over"&&r.s.k==="bad")||(S.mf==="noprice"&&r.s.t==="No price")));
  view.innerHTML=`
  <div class="ph"><div><h1>Menu</h1></div><button class="btn primary" id="new-drink">${IC.plus}New drink</button></div>
  <div class="kpis">
    <div class="card kpi"><div class="k">Drinks</div><div class="v">${rows.length}</div><div class="s">${priced.length} priced</div></div>
    <div class="card kpi"><div class="k">Avg cost %</div><div class="v">${avg==null?"—":pct(avg)}</div><div class="s">of priced drinks</div></div>
    <div class="card kpi ${fix?"alert":""}"><div class="k">Drinks to fix</div><div class="v">${fix}</div><div class="s">missing data</div></div>
    <button class="card kpi ${nItems?"alert":""}" data-nav="items" style="text-align:left;cursor:pointer"><div class="k">Ingredients to fix</div><div class="v">${nItems}</div><div class="s">${nItems?"Open ›":"All priced"}</div></button>
  </div>
  <div class="card">
    <div class="card-h toolbar">
      <div class="search">${IC.search}<input class="in" id="q" placeholder="Search drinks" value="${esc(S.q)}"></div>
      <div class="chips">${[["all","All"],["fix","To fix"],["over","Over target"],["noprice","No price"]].map(([k,l])=>`<button class="chip" data-mf="${k}" aria-pressed="${S.mf===k}">${l}</button>`).join("")}</div>
    </div>
    <div class="tw"><table>

function subHTML(l,r,i,f){
  const name=r.it?esc(r.it.name):"";
  if(l.itemId&&!r.it) return `<button class="badge warn" data-focus="ln-${i}-item">Choose again</button>`;
  if(!l.itemId) return "";
  if(r.blankQty) return `<button class="badge warn" data-focus="ln-${i}-qty">Add amount</button>`;
  if(r.status==="density") return `<button class="badge warn" data-fix="${l.itemId}" data-field="dens">Add 100 ml weight</button>`;
  if(r.status==="mismatch") return `<span class="badge warn">Use ${esc(r.it.unit)}</span>`;
  const parts=[];
  if(r.base==null) parts.push(`<button class="badge warn" data-fix="${l.itemId}" data-field="${isPrep(r.it)?"open":"price"}">${isPrep(r.it)?"Incomplete":"Add price"}</button>`);
  else parts.push(`<span>${peso4(r.rate)}/${esc(r.unit)}</span>`);
  if(f!==1&&r.used!=null) parts.push(`<span>uses ${+r.used.toFixed(2)} ${esc(r.unit)}</span>`);
  parts.push(`<label class="sw" title="Scales with size"><input type="checkbox" data-f="scales"${l.fixed?"":" checked"}> Scales</label>`);
  return parts.join("");
}
function recompute(){
  if(S.view!=="drink"&&S.view!=="prep") return;
  const c=cur(), d=c.doc, f=scaleOf(d), o=k=>view.querySelector(`[data-out="${k}"]`);
  const r=c.kind==="drink"?drinkCalc(d,S.items):recipeCost(d.lines,S.items,1,f);
  r.lines.forEach((l,i)=>{
    const cell=o("cost"+i); if(cell) cell.textContent=l.it?peso(l.cost):"";
    if(deskCells(d.lines[i],l,i,f)) return;
    const sub=o("sub"+i); if(sub){sub.innerHTML=subHTML(d.lines[i],l,i,f);sub.parentElement.classList.toggle("flag",!!sub.querySelector(".badge.warn"));}
  });
  o("total").textContent=peso(r.total);
  const n=(d.lines||[]).filter(l=>l.itemId).length; o("count").textContent=n?n+" item"+(n>1?"s":""):"";
  const fo=o("factor");
  if(c.kind==="drink"){
    fo.textContent=f!==1?`Amounts × ${f.toFixed(3)} for a ${+(+d.targetVol).toFixed(0)} ml cup`:"";
    o("gp").textContent=peso(r.gp); o("pct").textContent=pct(r.costPct);
    const s=status(d,r), over=s.k==="bad";
    o("badge").innerHTML=`<span class="badge ${s.k}">${s.t}</span>`;
    o("apply").innerHTML=(r.suggested&&r.total>0&&s.k!=="warn"&&(s.k==="bad"||s.t==="No price"))?`<button class="btn sm" id="apply-price" data-price="${r.suggested.toFixed(2)}">Use ${peso(r.suggested)}</button>`:(r.suggested&&r.total>0&&s.k!=="warn"?`<span class="faint num" style="font-size:12px">Target ${peso(r.suggested)}</span>`:"");
    const m=o("meter"); m.className="meter"+(over?" over":""); m.querySelector("span").style.width=Math.min(100,(r.costPct||0)*100)+"%"; m.querySelector("i").style.left=Math.min(100,(+d.target||0)*100)+"%";
    const nu=recipeNutrition(d.lines,S.items,0,f); fillNut(nu.total,nu.missing,1);
  } else {
    const yq=+d.yieldQty*f, y=(d.yield==null||d.yield==="")?1:+d.yield, b=baseRate(d,S.items,0);
    fo.textContent=f!==1?`Batch × ${f}`:"";
    o("per").textContent=b==null?"—":peso4(b);
    o("badge").innerHTML=r.attention+r.unpriced?`<span class="badge warn">${r.attention+r.unpriced} to fix</span>`:(yq>0?'<span class="badge ok">Ready</span>':'<span class="badge warn">Add batch size</span>');
    if(d.nutrManual){const v=nutrPer100(d,S.items,0),m={};NUTS.forEach(([k])=>{m[k]=v[k]==null?1:0;if(v[k]==null)v[k]=0;});fillNut(v,m,1,true);}
    else {const nu=recipeNutrition(d.lines,S.items,1,f); fillNut(nu.total,nu.missing,yq>0?100/yq:null);}
  }
}
function fillNut(t,miss,scale,manual){
  NUTS.forEach(([k,,u])=>{const el=view.querySelector(`[data-out="n-${k}"]`);if(!el)return;
    if(manual&&miss[k]){el.innerHTML='<span class="faint">—</span>';return;}
    const v=scale==null?null:t[k]*scale;
    el.innerHTML=miss[k]?`<span class="badge warn">${miss[k]} missing</span>`:(v==null?"—":fmtN(v,u));});
}

let pendingRender=false;
function editing(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="SELECT")&&(view.contains(a)||$("#drawer").contains(a));}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender&&!editing()){pendingRender=false;render();if(S.drawer)drawRender();}},0));
function applySnap(col,snap){
  if(snap.metadata.hasPendingWrites) return;
  const next={}; snap.docs.forEach(d=>{next[d.id]=JSON.parse(JSON.stringify(d.data()));});
  const curr=col==="items"?S.items:S.drinks;
  for(const id in curr) if(timers[col+id]) next[id]=curr[id];
  if(col==="items") S.items=next; else S.drinks=next;
  S.loaded[col]=true;
  if(editing()) pendingRender=true; else {render(); if(S.drawer) drawRender();}
}
(async()=>{
  const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  if(!db){S.loaded.items=S.loaded.drinks=true;toastErr("Not saving in this view");render();return;}
  S.db=db;
  for(const col of ["items","drinks"]){
    db.collection(col).onSnapshot(s=>applySnap(col,s),err=>{S.loaded[col]=true;if(err&&err.code==="revoked")S.readonly=true;else toastErr("Reload to reconnect");render();});
  }
})();

/* ---------- public menu mirror: what customers see (no costs, no amounts) ---------- */
function ingredientNames(lines, depth) {
  const out = [];
  for (const l of lines || []) {
    const it = S.items[l.itemId]; if (!it || it.category === "Packaging") continue;
    let n = it.name || ""; if (!n) continue;
    if (isPrep(it) && depth < 1) { const sub = ingredientNames(it.lines, depth + 1); if (sub.length) n += " (" + sub.join(", ") + ")"; }
    if (!out.some(x => x.split(" (")[0].toLowerCase() === n.split(" (")[0].toLowerCase())) out.push(n);
  }
  return out;
}
function mirrorOf(id, d) {
  const n = recipeNutrition(d.lines, S.items, 0, scaleOf(d));
  return { name: d.name || "Drink", cup: cup(d) ? Math.round(cup(d)) : null, price: +d.price > 0 ? +(+d.price).toFixed(2) : null,
    available: !d.soldOut, kcal: n.missing.kcal ? null : Math.round(n.total.kcal), ingredients: ingredientNames(d.lines, 0), group: slug(d.name) };
}
function publishPlan() {
  const want = {};
  drinks().forEach(([id, d], i) => { if (d.sellOnline && +d.price > 0) want[id] = Object.assign(mirrorOf(id, d), { sort: i }); });
  const sets = Object.entries(want).filter(([id, m]) => JSON.stringify(ORD.menu[id] || null) !== JSON.stringify(m));
  const dels = Object.keys(ORD.menu).filter(id => !want[id]);
  return { want, sets, dels };
}
async function publish() {
  const p = publishPlan();
  for (const [id, m] of p.sets) await S.db.collection("menu").doc(id).set(m);
  for (const id of p.dels) await S.db.collection("menu").doc(id).delete();
}

/* ---------- photos: shrink in the browser before saving ---------- */
function shrinkImage(file, maxSide, type, quality) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height)), w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = Object.assign(document.createElement("canvas"), { width: w, height: h }), g = c.getContext("2d");
      if (type === "image/jpeg") { g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); }
      g.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(c.toDataURL(type, quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("not an image")); };
    img.src = url;
  });
}

    const el = e.target;
    if (el.id === "s-open") { saveSettings({ open: el.checked }); renderOnline(); return; }
    if (el.dataset.sell) { const d = S.drinks[el.dataset.sell]; d.sellOnline = el.checked; save("drinks", el.dataset.sell, true); renderOnline(); return; }
    if (el.dataset.sold) { const d = S.drinks[el.dataset.sold]; d.soldOut = el.checked; save("drinks", el.dataset.sold, true); renderOnline(); return; }
    if (el.id === "s-qrfile" && el.files[0]) { try { saveSettings({ qr: await shrinkImage(el.files[0], 800, "image/png") }); renderOnline(); } catch { toastErr("That file isn't an image"); } return; }
    if (el.dataset.photo && el.files[0]) {
      try { let q = 0.72, data = await shrinkImage(el.files[0], 720, "image/jpeg", q);
        while (data.length > 700000 && q > 0.35) { q -= 0.12; data = await shrinkImage(el.files[0], 640, "image/jpeg", q); }
        await S.db.collection("photos").doc(el.dataset.photo).set({ data, updatedAt: Date.now() }); }
      catch { toastErr("Photo not saved"); } return; }
  });
}

</script>
<script type="module" src="auth.js"></script>
</body>
</html>
