<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B58">
<title>Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F6F6F4;--surface:#fff;--sunken:#F1F1EE;--border:#E4E4E0;--text:#16171A;--muted:#6C6D72;--faint:#9A9BA0;
  --accent:#1E6B58;--accent-ink:#fff;--accent-soft:#E6F2ED;--ok:#0F7A4A;--ok-bg:#E3F5EA;--warn:#9A5B07;--warn-bg:#FCF0D9;--bad:#B42318;--bad-bg:#FDE7E5;
  --shadow:0 1px 2px rgba(16,17,20,.06);--f:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111213;--surface:#18191B;--sunken:#1F2022;--border:#2A2B2E;--text:#ECECEA;--muted:#9C9DA3;--faint:#6F7076;
  --accent:#5FC0A2;--accent-ink:#0B1F19;--accent-soft:#16302A;--ok:#5CCB8F;--ok-bg:#12291D;--warn:#E3A645;--warn-bg:#2E2312;--bad:#F2786C;--bad-bg:#331816;color-scheme:dark}}
*{box-sizing:border-box} [hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
header{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:18px 0 12px}
header i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
header h1{font-size:19px;font-weight:600;margin:0}
main{max-width:960px;margin:0 auto}
.banner{background:var(--sunken);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.banner.bad{background:var(--bad-bg);color:var(--bad);font-weight:500}
.mine{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--text);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.item .ph{aspect-ratio:4/3;background:var(--accent-soft);display:grid;place-items:center;max-width:100%}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .ph span{font-size:44px;font-weight:700;color:var(--accent);opacity:.5}
.ib{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.ib h2{font-size:17px;font-weight:600;margin:0}
.ing{margin:0;font-size:13px;color:var(--muted)}
.sizes{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.sz{display:grid;grid-template-columns:1fr auto 92px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.sz.off{opacity:.55}
.kcal{display:block;font-size:12px;color:var(--faint)}
.pr{font-weight:600;font-variant-numeric:tabular-nums}
.add{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:99px;padding:6px 0;font-weight:600;cursor:pointer;width:100%}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:2px}
.qty button{border:0;background:transparent;color:inherit;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer}
.so{font-size:12px;color:var(--bad);text-align:center}
.foot{color:var(--faint);font-size:12px;text-align:center;margin:20px 0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.bar button,.primary{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;margin:0 auto;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font-weight:600;font-size:16px;cursor:pointer}
.primary{justify-content:center}
.primary:disabled{opacity:.6}
.shade{position:fixed;inset:0;background:rgba(10,10,12,.4);z-index:30;display:none}.shade.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:16px 16px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .22s ease;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}.sh-h h3{margin:0;font-size:17px}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.sh-b{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sh-f{padding:12px 18px 16px;border-top:1px solid var(--border)}
.lines{list-style:none;margin:0;padding:0}.lines li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px}
.lines i{color:var(--faint);font-style:normal;font-size:12px}
.tot{display:flex;justify-content:space-between;font-size:16px;padding:4px 0}
.f{display:flex;flex-direction:column;gap:5px}.f span{font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.ord{max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.back{color:var(--muted);text-decoration:none;font-size:14px}
.code{font-size:14px;color:var(--muted)}.code b{font-size:26px;color:var(--text);letter-spacing:.04em;display:block}
.st{margin:0;font-size:20px}.st.ready{color:var(--ok)}.st.cancelled{color:var(--bad)}
.muted{color:var(--muted);margin:0}.hint{color:var(--faint);font-size:12px;margin:0;text-align:center}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.steps span{font-size:11px;text-align:center;color:var(--faint);padding-top:6px;border-top:3px solid var(--border)}
.steps span.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.pay{display:flex;flex-direction:column;gap:10px;align-items:stretch;background:var(--sunken);border-radius:12px;padding:14px}
.amt{text-align:center;font-size:15px}.amt b{font-size:24px;display:block}
.qr{width:min(260px,100%);aspect-ratio:1;object-fit:contain;margin:0 auto;background:#fff;border-radius:10px;padding:8px}
.ghost{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px;text-align:center;color:var(--text);text-decoration:none;font-weight:500;cursor:pointer}
.ghost.sm{padding:3px 9px;font-size:12px;border-radius:8px}
.gnum{text-align:center;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h12v5a6 6 0 0 1-12 0z"/><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/></svg></i><h1 id="shop">Order</h1></header>
<main id="view"><div class="empty">Loading menu…</div></main>
<div class="bar" id="bar" hidden><button id="checkout"><span id="bar-t"></span><span>Checkout ›</span></button></div>
<div class="shade" id="shade"></div>
<section class="sheet" id="sheet" aria-label="Checkout"></section>
<script type="module" src="order.js"></script>
</body>
</html>
