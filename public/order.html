<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcf8f1">
<meta name="color-scheme" content="light">
<title>MIAU · Order</title>
<link rel="icon" href="brand/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MIAU">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* MIAU brand: one warm light look on purpose (matches the logo artwork). */
:root{
  --cream:#fcf8f1; --cocoa:#3e2f24; --terra:#b96a4c;
  --sand:#f3e7d6; --blush:#f3dccf; --oat:#ece3d6; --paper:#ffffff;
  --ink:#3e2f24; --muted:#7c6a5c; --line:#e7dccd; --terra-dk:#a05a3f; --ok:#4e7d4f; --bad:#b0412b;
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:28px; --r:18px; --pill:999px;
  color-scheme:light;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
body>main{flex:1 0 auto;width:100%}
button,input,select{font:inherit;color:inherit}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--terra);outline-offset:3px;border-radius:12px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* announcement + header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cocoa);z-index:50}
.announce{background:var(--cocoa);color:var(--cream);text-align:center;font:700 13px/1 var(--body);letter-spacing:.04em;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(252,248,241,.94);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.scrolled{border-color:var(--line)}
.hdr-r{display:flex;align-items:center;gap:8px}
.getapp{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--cocoa);background:transparent;color:var(--cocoa);border-radius:var(--pill);padding:8.5px 14px;font:700 14px var(--body);cursor:pointer}
.getapp[hidden]{display:none}
.getapp{white-space:nowrap}
.getapp .short{display:none}
@media (max-width:480px){.getapp .long{display:none}.getapp .short{display:inline}.getapp{padding-inline:12px}}
.getapp:hover{background:var(--sand)}
.ios-tip{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--cocoa);color:var(--cream);border-radius:20px;padding:16px 18px 16px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 14px 40px rgba(62,47,36,.3);font-size:15px;line-height:1.45}
.ios-tip img{width:52px;height:52px;border-radius:12px;flex:none}
.ios-tip b{font-weight:800}
.ios-tip .x{margin-left:auto;align-self:flex-start;background:none;border:0;color:inherit;font-size:22px;line-height:1;cursor:pointer;padding:0 2px;opacity:.8}
.ios-tip svg{vertical-align:-3px}
.offline{background:var(--terra);color:#fff;text-align:center;font:700 13px var(--body);padding:7px 12px}
@media (display-mode:standalone){.announce{padding-top:6px}}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:block;height:36px;width:auto}
.logo img{height:100%;width:auto;display:block}
.bagbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--cocoa);color:var(--cream);border-radius:var(--pill);padding:10px 16px 10px 14px;font:700 15px var(--body);cursor:pointer}
.bagbtn .n{background:var(--terra);color:#fff;min-width:22px;height:22px;border-radius:var(--pill);display:inline-grid;place-items:center;font-size:12px;padding:0 6px}

/* hero */
.hero{padding-top:14px}
.hero-art{border-radius:var(--r-lg);overflow:hidden;background:var(--cream);aspect-ratio:2/1;max-width:100%}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block}
.hero-copy{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 6px}
.hero h1{font:700 clamp(40px,8vw,72px)/.95 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--muted);font-weight:600;max-width:46ch}
.status{display:inline-flex;align-items:center;gap:8px;border-radius:var(--pill);padding:8px 14px;font:700 14px var(--body);background:var(--sand)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.status.closed{background:var(--blush);color:var(--bad)} .status.closed i{background:var(--bad)}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.pill{flex:none;border:2px solid var(--cocoa);background:transparent;border-radius:var(--pill);padding:8px 16px;font:700 14px var(--body);cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--cocoa);color:var(--cream)}
.mine{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mine a{background:var(--paper);border:1px solid var(--line);border-radius:var(--pill);padding:6px 12px;font:700 13px var(--body);text-decoration:none}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:20px;padding:18px 0 8px}
.item{display:flex;flex-direction:column;gap:12px;min-width:0}
.tile{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1/1;display:grid;place-items:center;max-width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.item:hover .tile img{transform:scale(1.04)}

.tile img.cat{object-fit:contain;padding:9%;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.item:hover .tile img.cat{transform:rotate(-4deg) scale(1.05)}
.breed{margin:-4px 0 0;font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--terra)}
.desc{margin:0;font-size:15px;line-height:1.5}
.price.soon{font-size:20px;color:var(--muted)}
.crewnote{color:var(--muted);font-size:13px;font-weight:600;text-align:center;margin:4px 0 0}
.status.soon{background:var(--blush);color:var(--terra-dk)} .status.soon i{background:var(--terra)}
.bl .th img.cat{object-fit:contain;padding:6px}
.t0{background:var(--sand)} .t1{background:var(--blush)} .t2{background:var(--oat)}

.tag{position:absolute;top:14px;left:14px;background:var(--cocoa);color:var(--cream);border-radius:var(--pill);padding:5px 12px;font:800 12px var(--body);letter-spacing:.05em;text-transform:uppercase}
.kcalchip{position:absolute;top:14px;right:14px;background:rgba(252,248,241,.92);border-radius:var(--pill);padding:5px 11px;font:800 12px var(--body)}
.ib{display:flex;flex-direction:column;gap:8px;padding:0 4px;flex:1}
.ib h2{font:600 24px/1.1 var(--display);margin:0}
.ing{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.ing b{color:var(--ink);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;margin-top:2px}
.sz{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 9px;cursor:pointer;text-align:left;min-width:0;line-height:1.2}
.sz b{display:block;font:700 15px var(--body)}
.sz span{font-size:12px;color:var(--muted);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sz[aria-pressed="true"]{border-color:var(--cocoa);background:var(--cocoa);color:var(--cream)} .sz[aria-pressed="true"] span{color:var(--sand)}
.sz:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.buy{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:4px}
.price{font:700 24px var(--display)}
.add{border:0;background:var(--terra);color:#fff;border-radius:var(--pill);padding:12px 22px;font:800 15px var(--body);cursor:pointer;transition:background .15s,transform .1s}
.add:hover{background:var(--terra-dk)} .add:active{transform:scale(.97)}
.add:disabled{background:var(--oat);color:var(--muted);cursor:not-allowed}
.qty{display:inline-flex;align-items:center;gap:4px;background:var(--cocoa);color:var(--cream);border-radius:var(--pill);padding:4px}
.qty button{border:0;background:transparent;color:inherit;width:36px;height:36px;border-radius:50%;font:700 20px var(--body);cursor:pointer}
.qty button:hover{background:rgba(255,255,255,.12)}
.qty b{min-width:22px;text-align:center}
.empty{padding:56px 16px;text-align:center;color:var(--muted);font-weight:600}

/* footer */
footer{margin-top:40px;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--sand);border-radius:var(--r-lg) var(--r-lg) 0 0}
footer .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-block:28px}
footer img{height:30px;width:auto}
footer p{margin:0;color:var(--muted);font-size:14px;font-weight:600}

/* mobile bag bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(252,248,241,0),var(--cream) 35%)}
.bar button{width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:var(--pill);background:var(--cocoa);color:var(--cream);padding:16px 22px;font:800 16px var(--body);cursor:pointer;box-shadow:0 10px 30px rgba(62,47,36,.25)}

/* bag drawer */
.shade{position:fixed;inset:0;background:rgba(62,47,36,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;background:var(--cream);display:flex;flex-direction:column;transition:transform .25s ease;
  top:0;right:0;bottom:0;width:min(440px,100%);transform:translateX(102%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.on{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font:700 26px var(--display)}
.x{border:0;background:var(--sand);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.sh-b{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.sh-f{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.bl{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.bl .th{width:64px;height:64px;border-radius:16px;overflow:hidden;display:grid;place-items:center}
.bl .th img{width:100%;height:100%;object-fit:cover}
.bl .th .mono{font:700 30px var(--display);color:var(--terra)}
.bl h4{margin:0;font:600 17px var(--display)} .bl small{color:var(--muted);font-weight:600}
.bl .qty{padding:2px} .bl .qty button{width:30px;height:30px;font-size:17px}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.sum b{font:700 26px var(--display)}
.f{display:flex;flex-direction:column;gap:6px}
.f span{font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:16px;width:100%}
.f input:focus,.f select:focus{outline:none;border-color:var(--terra)}
.err{color:var(--bad);font-size:14px;font-weight:700;min-height:20px}
.primary{border:0;border-radius:var(--pill);background:var(--terra);color:#fff;padding:16px 22px;font:800 17px var(--body);cursor:pointer;width:100%}
.primary:hover{background:var(--terra-dk)} .primary:disabled{opacity:.6}
.ghost{border:2px solid var(--cocoa);background:transparent;border-radius:var(--pill);padding:11px 18px;font:800 15px var(--body);cursor:pointer;text-align:center;text-decoration:none;display:inline-block}
.ghost.sm{padding:4px 12px;font-size:13px;border-width:1.5px}
.bag-empty{text-align:center;padding:36px 8px;display:flex;flex-direction:column;gap:14px;align-items:center}
.bag-empty img{width:220px;max-width:100%}
.bag-empty p{margin:0;font:600 20px/1.3 var(--display)}

/* order status */
.ord{max-width:560px;margin:18px auto 0;display:flex;flex-direction:column;gap:14px}
.ocard{background:var(--paper);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 var(--line)}
.back{font-weight:800;text-decoration:none;color:var(--muted)}
.code{color:var(--muted);font-weight:700}.code b{display:block;font:700 44px/1 var(--display);color:var(--ink);letter-spacing:.04em}
.st{margin:0;font:700 30px/1.1 var(--display)} .st.ready{color:var(--ok)} .st.cancelled{color:var(--bad)}
.muted{color:var(--muted);margin:0;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps span{font:800 12px var(--body);text-align:center;color:var(--muted);padding-top:8px;border-top:5px solid var(--oat);border-radius:3px}
.steps span.on{color:var(--terra);border-color:var(--terra)}
.pay{display:flex;flex-direction:column;gap:12px;background:var(--sand);border-radius:var(--r);padding:18px}
.amt{text-align:center;font-weight:700}.amt b{display:block;font:700 40px var(--display)}
.qr{width:min(260px,100%);aspect-ratio:1;object-fit:contain;margin:0 auto;background:#fff;border-radius:18px;padding:10px;display:block}
.gnum{text-align:center;font-weight:700}
.hint{color:var(--muted);font-size:13px;margin:0;text-align:center;font-weight:600}
.lines{list-style:none;margin:0;padding:0}.lines li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:600}
.lines i{color:var(--muted);font-style:normal;font-size:13px}
.ready-art{border-radius:var(--r);overflow:hidden}
.ready-art img,.bag-empty img{width:100%;height:auto;display:block}

@media (min-width:720px){
  .logo{height:46px}
  .hero-art{aspect-ratio:2.6/1}
  .hero-art img{object-position:center 58%}
  .grid{gap:28px}
  .bar{display:none}
  body:has(.bar:not([hidden])) footer{padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (max-width:719px){
  body:has(.bar:not([hidden])) footer{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .sheet{top:auto;left:0;right:0;width:auto;max-height:92vh;border-radius:var(--r-lg) var(--r-lg) 0 0;transform:translateY(102%);padding-right:0}
  .sheet.on{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.item:hover .tile img{transform:none}}
</style>
</head>
<body>
<div class="announce" id="announce">ORDER AHEAD · PICK UP · PAY WITH GCASH</div>
<header class="hdr" id="hdr"><div class="wrap">
  <a class="logo" href="./order.html" aria-label="MIAU home"><img src="brand/miau-wordmark.png" srcset="brand/miau-wordmark.png 640w, brand/miau-wordmark@2x.png 1280w" sizes="170px" alt="MIAU" width="640" height="183"></a>
  <div class="hdr-r"><button class="getapp" id="getapp" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg><span class="long">Get the app</span><span class="short">App</span></button>
  <button class="bagbtn" id="bagbtn" aria-label="Open bag"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Bag <span class="n" id="bagn">0</span></button></div>
</div></header>
<main class="wrap" id="view"><div class="empty">Loading menu…</div></main>
<footer><div class="wrap"><img src="brand/miau-wordmark.png" alt="MIAU" width="640" height="183"><p id="foot">Pickup only · Pay with GCash · Calories are estimates from ingredient labels.</p></div></footer>
<div class="bar" id="bar" hidden><button id="checkout"><span id="bar-t"></span><span>View bag ›</span></button></div>
<div class="shade" id="shade"></div>
<section class="sheet" id="sheet" aria-label="Your bag" role="dialog" aria-modal="true"></section>
<script type="module" src="order.js"></script>
<script src="pwa.js" defer></script>
</body>
</html>
