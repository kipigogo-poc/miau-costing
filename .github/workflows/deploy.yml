name: Deploy

# Every push to main is checked, then deployed to Firebase (Hosting + Firestore security rules).
# Pull requests and other branches are only checked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check config, rules and scripts
        run: node scripts/check.mjs

  security:
    # Attacks the database rules (strangers, customers, non-staff) using Google's Firestore emulator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Database security tests
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx --yes firebase-tools@15.31.0 emulators:exec --only firestore --project demo-miau "node rules.test.mjs"

  deploy:
    needs: [check, security]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase
        run: |
          set -o pipefail
          npx --yes firebase-tools@15.31.0 deploy --only hosting,firestore:rules --non-interactive --message "${{ github.sha }}" 2>&1 | tee deploy.log
      - name: Show why the deploy failed
        if: failure()
        run: |
          # Which account and project are being used (not secret)
          SA=$(node -e "const k=require(process.env.GOOGLE_APPLICATION_CREDENTIALS);console.log(k.client_email+' (key project: '+k.project_id+')')" 2>/dev/null || echo "unknown")
          echo "::warning title=Deploy account::$SA → deploying to project $(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default")"
          # Firebase's own error lines, shown at the top of the run page
          grep -iE "error|denied|permission|forbidden|not been used|disabled|not found|HTTP [0-9]{3}" deploy.log | grep -viE "private_key|BEGIN" | head -8 \
            | while IFS= read -r line; do echo "::error title=Firebase::${line}"; done || true
